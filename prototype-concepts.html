<!doctype html>
<!-- Shareable review wrapper. The original website and four redesigns remain separate. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARC Lab — Compare complete site concepts</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #f7f9fb; color: #0c2947; font: 1rem Arial, sans-serif; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; background: white; }
    [hidden] { display: none !important; }
    .review-switcher { position: fixed; z-index: 100; bottom: 16px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 12px; width: min(520px, calc(100% - 24px)); padding: 8px; border: 1px solid #c9d7e4; border-radius: 16px; background: #fff; box-shadow: 0 6px 28px #0c294725; }
    .review-switcher button { width: 44px; height: 44px; border: 1px solid #dbe5ee; border-radius: 10px; background: #edf3f8; color: #0c2947; font: 22px Arial, sans-serif; cursor: pointer; }
    .review-switcher button:hover { color: white; background: #1f5f91; }
    .review-switcher button:focus-visible { outline: 3px solid #1f5f91; outline-offset: 2px; }
    .review-label { text-align: center; line-height: 1.35; }
    .review-label strong { display: block; font-size: 1rem; }
    .review-label span { display: block; margin-top: 3px; font-size: .875rem; color: #597084; }
    .review-label small { display: block; margin-top: 3px; color: #597084; font-size: .875rem; }
    @media print { .review-switcher { display: none; } }
  </style>
</head>
<body>
  <iframe id="concept-frame" src="prototypes/original/index.html" title="ARC Lab — 00 · Original Website — Home"></iframe>
  <nav class="review-switcher" id="review-switcher" aria-label="Compare design concepts" hidden>
    <button id="previous-concept" type="button" aria-label="Previous concept">←</button>
    <div class="review-label" aria-live="polite"><strong id="concept-label">00 · Original Website</strong><span id="concept-description">Original layout · baseline</span><small id="concept-page">Home</small></div>
    <button id="next-concept" type="button" aria-label="Next concept">→</button>
  </nav>
  <script>
    const concepts = [
      { key: 'original', folder: 'original', name: '00 · Original Website', description: 'Original layout · baseline' },
      { key: 'minimal', folder: 'minimal', name: '01 · Minimal / Motion', description: 'Oversized type · stationary A2' },
      { key: 'classic', folder: 'parentsquare', name: '02 · Classic Academic', description: 'Institutional · restrained' },
      { key: 'overview', folder: 'growthbook', name: '03 · Research Overview', description: 'Clear overview · restrained' },
      { key: 'grid', folder: 'boostlab', name: '04 · Interactive Grid', description: 'Interactive grid · expressive' }
    ];
    const aliases = new Map([['parentsquare', 'classic'], ['growthbook', 'overview'], ['boostlab', 'grid']]);
    const pages = new Map([
      ['index.html', 'Home'], ['people.html', 'Team'], ['publications.html', 'Publications'],
      ['research.html', 'Research'], ['join-us.html', 'Join us'], ['news/index.html', 'News'],
      ['research/interaction-centered-bim.html', 'Research · IC-BIM'],
      ['research/agent-oriented-design-construction.html', 'Research · Agent-oriented design'],
      ['research/representation-learning.html', 'Research · Representation learning'],
      ['research/robot-centric-construction.html', 'Research · Robot-centric construction'],
      ['news/arc-lab-website-launch.html', 'News · Website launch'],
      ['news/welcome-new-researchers.html', 'News · New researchers'],
      ['news/ai-built-environment-paper.html', 'News · AI for the built environment'],
      ['news/construction-robotics-digital-twins.html', 'News · Robotics and digital twins'],
      ['news/ic-bim-research-direction.html', 'News · IC-BIM'],
      ['news/robot-centric-construction-seminar.html', 'News · Robot-centric construction seminar']
    ]);
    const frame = document.querySelector('#concept-frame');
    const params = new URLSearchParams(location.search);
    const requested = params.get('variant') || 'original';
    let current = Math.max(0, concepts.findIndex(concept => concept.key === (aliases.get(requested) || requested)));
    let currentPage = pages.has(params.get('page')) ? params.get('page') : 'index.html';
    let currentHash = location.hash;
    function updateReview() {
      const concept = concepts[current];
      frame.title = 'ARC Lab — ' + concept.name + ' — ' + pages.get(currentPage);
      document.querySelector('#concept-label').textContent = concept.name;
      document.querySelector('#concept-description').textContent = concept.description;
      document.querySelector('#concept-page').textContent = pages.get(currentPage);
      const url = new URL(location.href);
      url.searchParams.set('variant', concept.key);
      if (currentPage === 'index.html') url.searchParams.delete('page');
      else url.searchParams.set('page', currentPage);
      url.hash = currentHash;
      history.replaceState(null, '', url);
      document.title = 'ARC Lab concepts — ' + concept.name + ' — ' + pages.get(currentPage);
    }
    function show(index) {
      current = (index + concepts.length) % concepts.length;
      frame.src = 'prototypes/' + concepts[current].folder + '/' + currentPage + currentHash;
      updateReview();
    }
    function readFrameLocation() {
      const base = new URL('prototypes/' + concepts[current].folder + '/', location.href);
      const inner = new URL(frame.contentWindow.location.href);
      const page = inner.pathname.slice(base.pathname.length);
      if (inner.origin !== base.origin || !inner.pathname.startsWith(base.pathname) || !pages.has(page)) return false;
      currentPage = page;
      currentHash = inner.hash;
      return true;
    }
    function switchConcept(offset) {
      readFrameLocation();
      show(current + offset);
    }
    function handleKey(event) {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      switchConcept(event.key === 'ArrowRight' ? 1 : -1);
    }
    document.querySelector('#review-switcher').hidden = false;
    document.querySelector('#previous-concept').addEventListener('click', () => switchConcept(-1));
    document.querySelector('#next-concept').addEventListener('click', () => switchConcept(1));
    document.addEventListener('keydown', handleKey);
    frame.addEventListener('load', () => {
      if (readFrameLocation()) {
        updateReview();
        frame.contentDocument.addEventListener('keydown', handleKey);
        frame.contentDocument.addEventListener('click', () => {
          if (readFrameLocation()) updateReview();
        });
        frame.contentWindow.addEventListener('hashchange', () => {
          if (readFrameLocation()) updateReview();
        });
      }
    });
    show(current);
  </script>
</body>
</html>
